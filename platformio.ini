; PlatformIO Project Configuration File
;
; Alvo: ESP32-S3 Super Mini (ESP32-S3FH4R2 — flash 4 MB quad + PSRAM 2 MB quad,
; USB-Serial/JTAG nativo no USB-C). Configuração validada em hardware no projeto
; de teste do M0 (C:\Projetos\Esp32S3_SuperMini_Test).
;
; Não existe board oficial "Super Mini" no PlatformIO; usamos o esp32-s3-devkitc-1
; (mesmo MCU/variant) e sobrescrevemos flash e PSRAM.

[env:esp32s3_supermini]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; --- Ajustes para o FH4R2 (o devkitc-1 assume 8 MB e sem PSRAM) ---
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304
board_build.partitions    = default.csv        ; layout de 4 MB, 2 slots de app (OTA no M6)
board_build.arduino.memory_type = qio_qspi     ; flash quad + PSRAM quad

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial sai pelo próprio USB-C (sem adaptador)
    -DBOARD_HAS_PSRAM             ; habilita os 2 MB de PSRAM
    -DCORE_DEBUG_LEVEL=1

; Bibliotecas externas.
; ArduinoJson fica na v6 de propósito: a v7 troca documentos estáticos por
; alocação dinâmica — mudar de major junto com a plataforma seria variável a mais.
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    fastled/FastLED@3.9.13

; Porta desta máquina; remova as duas linhas para deixar o PlatformIO
; autodetectar pelo hwid 303A:1001.
upload_port  = COM6
monitor_port = COM6

; Velocidade do monitor serial (deve bater com SERIAL_BAUD_RATE no Config.h;
; no USB-CDC o baud é nominal, mas o pio monitor exige o valor).
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
